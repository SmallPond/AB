# SCARA Pen Plotter Configuration
# ESP32-S3 with stepstick drivers and servo
# X/Y: SCARA arms (16 microsteps)
# Z: Servo for pen lift/lower

name: ARTS
board: ESP32-S3-DevKitC-1
meta: 2026-04-11 Run

stepping:
  engine: RMT
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

kinematics:
  Scara:
    linkage1_mm: 200.0
    linkage2_mm: 200.0
    # M367 X-129.00 Y128.00: coordinate offset
    scara_offset_x: -129.0
    scara_offset_y: 128.0
    kinematic_segment_len_mm: 0.5

axes:
  shared_stepper_disable_pin: NO_PIN
  homing_runs: 1
  
  x:
    # M92 X48.80: steps per mm
    steps_per_mm: 48.80
    # M203 X1000.00: max rate 1000 mm/s = 60000 mm/min
    max_rate_mm_per_min: 60000
    # M201 X1000: acceleration 1000 mm/s²
    acceleration_mm_per_sec2: 1000
    max_travel_mm: 360
    soft_limits: false

    homing:
      cycle: 1
      mpos_mm: -21.926
      positive_direction: false
      seek_mm_per_min: 2700
      feed_mm_per_min: 540
      
    motor0:
      limit_all_pin: gpio.18:high:pu
      hard_limits: true
      pulloff_mm: 5.0

      stepstick:
        direction_pin: gpio.42:low
        step_pin: gpio.41
        disable_pin: gpio.40

  y:
    # M92 Y48.80: steps per mm
    steps_per_mm: 48.80
    # M203 Y1000.00: max rate 1000 mm/s = 60000 mm/min
    max_rate_mm_per_min: 60000
    # M201 Y1000: acceleration 1000 mm/s²
    acceleration_mm_per_sec2: 1000
    max_travel_mm: 360
    soft_limits: false

    homing:
      cycle: 1
      mpos_mm: 46.6
      positive_direction: true
      seek_mm_per_min: 2700
      feed_mm_per_min: 540

    motor0:
      limit_all_pin: gpio.2:high:pu
      hard_limits: true
      pulloff_mm: 5.0
      
      stepstick:
        direction_pin: gpio.16:low
        step_pin: gpio.15
        disable_pin: gpio.7

  z:
    # Servo for pen lift/lower
    # M4 L10.00 T90.00: L=pen down(10°), T=pen up(90°)
    steps_per_mm: 1.0
    max_rate_mm_per_min: 3600
    acceleration_mm_per_sec2: 1000
    max_travel_mm: 90
    soft_limits: false

    motor0:
      rc_servo:
        output_pin: gpio.38
        pwm_hz: 50
        min_pulse_us: 500
        max_pulse_us: 2500

control:
  safety_door_pin: NO_PIN
  cycle_start_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN

user_outputs:
  digital0_pin: gpio.8
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN

start:
  must_home: false
  deactivate_parking: false
  check_limits: true

parking:
  enable: false

macros:
  startup_line0: G21
  startup_line1: G90
  Macro0: G0 Z10
  Macro1: G0 Z90
  Macro2: G28
  after_homing: G28

arc_tolerance_mm: 0.002
# M205 X1.20: junction deviation (jerk)
junction_deviation_mm: 1.20
verbose_errors: true
report_inches: false
planner_blocks: 16
