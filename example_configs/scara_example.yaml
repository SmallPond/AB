# SCARA Kinematics Configuration Example
# This is an example configuration for a SCARA robot with absolute angle mode
#
# In absolute angle mode:
# - The first arm angle (theta) is measured from the -X axis
# - The second arm angle (psi) is measured from world coordinate system
#
# Hardware requirements:
# - 2 stepper motors for X and Y (SCARA arms)
# - Optional: Z axis motor for vertical movement
# - Limit switches for homing

name: SCARA Robot
board: FluidNC 4X 2209
meta: 2026-03-28 SCARA Absolute Angle Example

stepping:
  engine: I2S_STREAM
  idle_ms: 255
  dir_delay_us: 1
  pulse_us: 4
  disable_delay_us: 0

# UART for TMC drivers (if using TMC2209)
uart1:
  txd_pin: gpio.16
  rxd_pin: gpio.4
  baud: 115200
  mode: 8N1

# SCARA Kinematics Configuration
kinematics:
  Scara:
    # Length of the first (upper) arm in mm
    linkage1_mm: 150.0
    
    # Length of the second (lower) arm in mm
    linkage2_mm: 150.0
    
    # Offset from world coordinate system to user coordinate system
    # These define where your user coordinate (0,0) is located
    scara_offset_x: 0.0
    scara_offset_y: 0.0
    
    # Segment length for breaking up non-linear moves (mm)
    # Smaller values = smoother motion but more computation
    kinematic_segment_len_mm: 1.0

axes:
  shared_stepper_disable_pin: NO_PIN
  homing_runs: 1
  
  # X Axis - First SCARA Arm (theta)
  # Note: For SCARA, steps_per_mm is actually steps_per_degree
  # Example: 200 steps/rev * 16 microsteps = 3200 steps/rev = 3200 steps/360 degrees = 8.89 steps/degree
  x:
    steps_per_mm: 8.89          # Steps per degree (not mm for SCARA)
    max_rate_mm_per_min: 3600   # Degrees per minute
    acceleration_mm_per_sec2: 200  # Degrees per sec^2
    max_travel_mm: 360          # Degrees of travel
    soft_limits: false
    homing:
      cycle: 1
      mpos_mm: 0                # Home position in degrees
      positive_direction: true
      seek_mm_per_min: 1800
      feed_mm_per_min: 360
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 2.0           # Pulloff in degrees
      tmc_2209:
        uart_num: 1
        addr: 0
        r_sense_ohms: 0.11
        run_amps: 1.2
        hold_amps: 0.5
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        homing_amps: 1.0
        use_enable: false
        direction_pin: i2so.1:low
        step_pin: i2so.2
        disable_pin: i2so.0

  # Y Axis - Second SCARA Arm (psi)
  # Note: Same as X axis, this is in degrees
  y:
    steps_per_mm: 8.89          # Steps per degree
    max_rate_mm_per_min: 3600   # Degrees per minute
    acceleration_mm_per_sec2: 200
    max_travel_mm: 360          # Degrees of travel
    soft_limits: false
    homing:
      cycle: 1
      mpos_mm: 0
      positive_direction: true
      seek_mm_per_min: 1800
      feed_mm_per_min: 360
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 2.0
      tmc_2209:
        uart_num: 1
        addr: 1
        r_sense_ohms: 0.11
        run_amps: 1.2
        hold_amps: 0.5
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        homing_amps: 1.0
        use_enable: false
        direction_pin: i2so.4:low
        step_pin: i2so.5
        disable_pin: i2so.7

  # Z Axis - Optional vertical axis (uses standard mm units)
  z:
    steps_per_mm: 400
    max_rate_mm_per_min: 1000
    acceleration_mm_per_sec2: 100
    max_travel_mm: 200
    soft_limits: false
    homing:
      cycle: 2
      mpos_mm: 0
      positive_direction: true
      seek_mm_per_min: 500
      feed_mm_per_min: 200
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 2.0
      tmc_2209:
        uart_num: 1
        addr: 2
        r_sense_ohms: 0.11
        run_amps: 1.0
        hold_amps: 0.5
        microsteps: 16
        stallguard: 0
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StealthChop
        homing_mode: StealthChop
        homing_amps: 0.8
        use_enable: false
        direction_pin: i2so.9:low
        step_pin: i2so.10
        disable_pin: i2so.8

# I2S Output for stepper drivers
i2so:
  bck_pin: gpio.22
  data_pin: gpio.21
  ws_pin: gpio.17

# SPI (for SD card if needed)
spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18

# SD Card
sdcard:
  cs_pin: gpio.5
  card_detect_pin: NO_PIN

# Control pins
control:
  safety_door_pin: gpio.32:low:pu
  cycle_start_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN

# Probe
probe:
  pin: gpio.36:low
  toolsetter_pin: NO_PIN

# Startup behavior
start:
  must_home: true
  deactivate_parking: false
  check_limits: true

# Parking (optional)
parking:
  enable: false
  axis: Z
  target_mpos_mm: -5.0
  rate_mm_per_min: 800.0
  pullout_distance_mm: 5.0
  pullout_rate_mm_per_min: 250.0

# Planner settings
arc_tolerance_mm: 0.002
junction_deviation_mm: 0.01
verbose_errors: true
report_inches: false
planner_blocks: 16
